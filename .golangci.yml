version: "2"
linters:
  default: standard
  enable: [depguard, forbidigo]
  settings:
    depguard:
      rules:
        cli-no-tabwriter:
          files: ["**/internal/cli/**", "!**/*_test.go"]
          deny:
            - pkg: text/tabwriter
              desc: table formatting belongs in internal/render (audit F14)
        render-pure:
          files: ["**/internal/render/**", "!**/internal/render/render.go", "!**/*_test.go"]
          deny:
            - pkg: os
              desc: renderers are pure functions of rows
            - pkg: net/http
              desc: renderers are pure functions of rows
            - pkg: os/exec
              desc: renderers are pure functions of rows
            - pkg: github.com/rootcause-org/rootcause-cli/internal/outputspill
              desc: map the artifact into a render-owned type (audit F15)
        digest-pure:
          files: ["**/internal/digest/**", "!**/*_test.go"]
          list-mode: lax
          allow:
            - github.com/rootcause-org/rootcause-cli/internal/client
          deny:
            - pkg: github.com/rootcause-org/rootcause-cli/internal
              desc: digest is pure analysis over internal/client wire rows; it imports no other sibling
            - pkg: os
              desc: digest is pure (no I/O); the CLI fetches, probes and threads `now` in
            - pkg: net/http
              desc: digest is pure (no I/O); the CLI fetches, probes and threads `now` in
        render-siblings:
          files: ["**/internal/render/**"]
          list-mode: lax
          allow:
            - github.com/rootcause-org/rootcause-cli/internal/client
            - github.com/rootcause-org/rootcause-cli/internal/digest
          deny:
            - pkg: github.com/rootcause-org/rootcause-cli/internal
              desc: renderers see wire rows (client) and their analysis (digest) only
        client-leaf:
          files: ["**/internal/client/**"]
          deny:
            - pkg: github.com/rootcause-org/rootcause-cli/internal
              desc: internal/client imports no sibling package
        token-leaf:
          files: ["**/internal/token/**"]
          deny:
            - pkg: github.com/rootcause-org/rootcause-cli/internal/config
              desc: the token store does not depend on config resolution (audit S4)
    forbidigo:
      # Rules are global; each msg carries a [tag] and linters.exclusions below scopes it to its packages.
      analyze-types: true
      forbid:
        - pattern: '^time\.Now$'
          pkg: '^time$'
          msg: "[pure] renderers and digest are functions of their inputs: thread `now` in from internal/cli (audit F12)"
        - pattern: '^os\.Getenv$'
          pkg: '^os$'
          msg: "[pure] renderers and digest read no environment"
  exclusions:
    rules:
      - linters: [forbidigo]
        path-except: 'internal/(render|digest)/'
        text: '\[pure\]'
      - linters: [forbidigo]
        path: '_test\.go$'
        text: '\[pure\]'
