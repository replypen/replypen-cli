# Build, vet, and test on every push + PR — the green-before-merge gate.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: shellcheck scripts/cloud-setup.sh scripts/release.sh scripts/lint-contracts.sh
      - run: bash scripts/lint-contracts.sh
      - name: golangci-lint (standard linters + the dependency/purity contracts in .golangci.yml)
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.15
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w ."; exit 1; }
